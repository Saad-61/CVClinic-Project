description: 'CVClinic RAG Pipeline Promptfoo Evaluation'

prompts:
  - 'Analyze CV for {{target_role or job_title}}'

providers:
  - id: 'file://evaluation/promptfoo_provider.js'



tests:
  - description: 'JD-001: Remote Fullstack Alignment (JD Mode)'
    vars:
      cv_name: 'JohnDoe'
      job_title: 'Remote Fullstack Engineer'
      job_description: |
        We are looking for a Remote Fullstack Engineer.
        Requirements:
        - 3+ years experience with React and Node.js.
        - Experience with Python or Go.
        - Solid understanding of Docker and AWS.
    assert:
      - type: is-json
      - type: javascript
        value: |
          const data = JSON.parse(output);
          return Array.isArray(data.missing_skills) && data.missing_skills.length === 1;

  - description: 'RAG-001: Backend Developer Alignment'
    vars:
      cv_name: 'SaadAsifResume'
      target_role: 'Backend Developer'
    assert:
      - type: is-json
      - type: javascript
        value: |
          const data = JSON.parse(output);
          return Array.isArray(data.missing_skills) && data.missing_skills.length === 5;
      - type: javascript
        value: |
          const data = JSON.parse(output);
          return Array.isArray(data.top_actions) && data.top_actions.length === 3;
      - type: llm-rubric
        value: |
          Evaluate the personalization of the recommendations. They must name specific projects from the candidate's CV (such as BookYourShoot or ScoutVCT) and reference specific missing skills. The output is a pass if highly personalized, and a fail if generic or could apply to anyone.
        provider: 'groq:llama-3.3-70b-versatile'
      - type: llm-rubric
        value: |
          Evaluate the quality of the career recommendation. Check if it contains a clear career goal (WHAT), explains the rationale (WHY), details the execution steps (HOW), describes expected outcome impact (IMPACT), and estimates study hours (EFFORT). Deduct points for any missing component.
        provider: 'groq:llama-3.3-70b-versatile'

  - description: 'RAG-002: Frontend Developer Alignment'
    vars:
      cv_name: 'JohnDoe'
      target_role: 'Frontend Developer'
    assert:
      - type: is-json
      - type: javascript
        value: |
          const data = JSON.parse(output);
          return Array.isArray(data.missing_skills) && data.missing_skills.length === 5;
      - type: javascript
        value: |
          const data = JSON.parse(output);
          return Array.isArray(data.top_actions) && data.top_actions.length === 3;
      - type: llm-rubric
        value: |
          Evaluate personalization. Check if recommendations mention John's website or basic calculator, and identify gaps in modern frameworks (like React).
        provider: 'groq:llama-3.3-70b-versatile'
